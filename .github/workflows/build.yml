name: Build iPhone USB receiver

# Builds BOTH sides in the cloud. You never compile anything.
#   - iOS: unsigned .ipa  -> install on phone via TrollStore (no Mac, no PC, no cert)
#   - Windows: receiver.exe + runtime DLLs -> download, run on the PC
# Trigger: push to main, or run manually from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Build unsigned app
        run: |
          xcodebuild clean build \
            -project ios/iPhoneCameraStream.xcodeproj \
            -target iPhoneCameraStream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check iPhone preview source contract
        run: |
          plutil -extract NSLocalNetworkUsageDescription raw "$GITHUB_WORKSPACE/ios/Info.plist"
          sh tests/ios_preview_source_contract.sh \
            ios/AppDelegate.swift \
            ios/CameraViewController.swift \
            ios/iPhoneCameraStream.xcodeproj/project.pbxproj
          sh tests/stream_sender_source_contract.sh ios/StreamSender.swift
          sh tests/encoder_setup_source_contract.sh ios/CameraStreamer.swift
          sh tests/hevc_join_source_contract.sh ios/CameraStreamer.swift ios/StreamSender.swift

      - name: Package unsigned IPA (TrollStore-ready)
        run: |
          APP="$GITHUB_WORKSPACE/ios/build/Release-iphoneos/iPhoneCameraStream.app"
          test -d "$APP"
          EXECUTABLE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")
          test -x "$APP/$EXECUTABLE"
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r iPhoneCameraStream.ipa Payload
          ls -lh iPhoneCameraStream.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: iPhoneCameraStream-ipa
          path: iPhoneCameraStream.ipa

  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libusbmuxd
            git
            make

      - name: Build receiver.exe and portable contract tests
        run: |
          sh "${{ github.workspace }}/tests/virtual_camera_source_contract.sh" \
            "${{ github.workspace }}/windows/virtual_camera.cpp"
          sh "${{ github.workspace }}/tests/receiver_source_contract.sh" \
            "${{ github.workspace }}/windows/receiver.cpp"
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/protocol" \
            "${{ github.workspace }}/tests/protocol_selftest.cpp" \
            -o protocol_selftest.exe
          ./protocol_selftest.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/windows" \
            "${{ github.workspace }}/tests/virtual_camera_contract_test.cpp" \
            -o virtual_camera_contract_test.exe
          ./virtual_camera_contract_test.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/protocol" \
            "${{ github.workspace }}/windows/receiver.cpp" \
            "${{ github.workspace }}/windows/gpu_frame_publisher.cpp" \
            -o receiver.exe \
            $(pkg-config --libs libavcodec libavutil libswscale) \
            $(pkg-config --libs libusbmuxd-2.0) -liphlpapi -lws2_32 -ld3d11 -ldxgi -lmfplat -ladvapi32
          ls -lh receiver.exe
          mkdir -p windows-binaries
          cp receiver.exe windows-binaries/
          ldd receiver.exe | awk '/\/mingw64\/bin\// { print $3 }' | sort -u | xargs -r -I{} cp "{}" windows-binaries/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: windows-binaries/

  # ---------------------------------------------------------------------------
  windows-virtual-camera:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore the documented Media Foundation source dependencies
        run: nuget restore third_party/VCamSample/VCamSample.sln

      - name: Build the native Frame Server source DLL (x64/MSVC)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild x64 was not found on the hosted Windows runner.' }
          $buildOutput = & $msbuild third_party/VCamSample/VCamSampleSource/VCamSampleSource.vcxproj `
            /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExitCode -ne 0) {
            $tail = ($buildOutput | Select-Object -Last 20) -join ' | '
            Write-Host "::error title=Virtual-camera MSVC build::$tail"
            exit $buildExitCode
          }

      - name: Build the virtual-camera registration controller (x64/MSVC)
        shell: pwsh
        run: |
          cmake -S windows/mf_virtual_camera -B build/mf-vcam -A x64 -DBUILD_TESTING=ON
          cmake --build build/mf-vcam --config Release --parallel
          ctest --test-dir build/mf-vcam -C Release --output-on-failure

      - name: Package OBS virtual-camera files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-virtual-camera | Out-Null
          Copy-Item third_party/VCamSample/VCamSampleSource/x64/Release/VCamSampleSource.dll windows-virtual-camera/IPhoneCameraStreamSource.dll
          Copy-Item build/mf-vcam/Release/IPhoneCameraVcamController.exe windows-virtual-camera/
          Copy-Item windows/mf_virtual_camera/INSTALL-OBS.ps1 windows-virtual-camera/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-virtual-camera
          path: windows-virtual-camera/
