name: Build iPhone USB receiver

# Builds BOTH sides in the cloud. You never compile anything.
#   - iOS: unsigned .ipa  -> install on phone via TrollStore (no Mac, no PC, no cert)
#   - Windows: receiver.exe + runtime DLLs -> download, run on the PC
# Trigger: push to main, or run manually from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Test length-prefixed HEVC conversion
        run: |
          xcrun swiftc -swift-version 5 \
            ios/LengthPrefixedHEVC.swift \
            tests/length_prefixed_hevc_test.swift \
            -o /tmp/length_prefixed_hevc_test
          /tmp/length_prefixed_hevc_test
          sh tests/length_prefixed_hevc_source_contract.sh
          xcrun swiftc -swift-version 5 \
            ios/LengthPrefixedHEVC.swift \
            tests/cmblockbuffer_hevc_test.swift \
            -framework CoreMedia \
            -o /tmp/cmblockbuffer_hevc_test
          /tmp/cmblockbuffer_hevc_test
          sh tests/cmblockbuffer_hevc_source_contract.sh

      - name: Test Swift wire-header mirror against C golden vector
        run: |
          xcrun swiftc -swift-version 5 \
            shared/StreamHeader.swift \
            tests/stream_header_test.swift \
            -o /tmp/stream_header_test
          /tmp/stream_header_test

      - name: Build unsigned app
        run: |
          xcodebuild clean build \
            -project ios/iPhoneCameraStream.xcodeproj \
            -target iPhoneCameraStream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check iPhone preview source contract
        run: |
          plutil -extract NSLocalNetworkUsageDescription raw "$GITHUB_WORKSPACE/ios/Info.plist"
          sh tests/ios_preview_source_contract.sh \
            ios/AppDelegate.swift \
            ios/CameraViewController.swift \
            ios/iPhoneCameraStream.xcodeproj/project.pbxproj
          sh tests/stream_sender_source_contract.sh ios/StreamSender.swift
          sh tests/encoder_setup_source_contract.sh ios/CameraStreamer.swift
          sh tests/hevc_join_source_contract.sh ios/CameraStreamer.swift ios/StreamSender.swift
          sh tests/camera_orientation_timestamp_contract.sh \
            ios/CameraStreamer.swift \
            ios/CameraViewController.swift \
            ios/Assets.xcassets/AppIcon.appiconset \
            ios/iPhoneCameraStream.xcodeproj/project.pbxproj \
            windows/receiver.cpp
          sh tests/camera_feedback_source_contract.sh \
            ios/CameraStreamer.swift \
            ios/StreamSender.swift \
            ios/CameraViewController.swift

      - name: Package unsigned IPA (TrollStore-ready)
        run: |
          APP="$GITHUB_WORKSPACE/ios/build/Release-iphoneos/iPhoneCameraStream.app"
          test -d "$APP"
          EXECUTABLE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")
          test -x "$APP/$EXECUTABLE"
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r iPhoneCameraStream.ipa Payload
          ls -lh iPhoneCameraStream.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: iPhoneCameraStream-ipa
          path: iPhoneCameraStream.ipa

  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - name: Validate iPhone app icon
        shell: pwsh
        run: ./tests/app_icon_contract.ps1 -IconPath ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libusbmuxd
            git
            make

      - name: Check architecture, protocol parity, and test registry
        run: |
          cd "${{ github.workspace }}"
          sh tests/architecture_boundary_contract.sh
          sh tests/protocol_parity_contract.sh
          sh tests/test_registry_contract.sh .github/workflows/build.yml scripts/check.sh

      - name: Build receiver.exe and portable contract tests
        run: |
          sh "${{ github.workspace }}/tests/receiver_source_contract.sh" \
            "${{ github.workspace }}/windows/receiver.cpp"
          sh "${{ github.workspace }}/tests/windows_ci_contract.sh" \
            "${{ github.workspace }}/.github/workflows/build.yml"
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/protocol" \
            "${{ github.workspace }}/tests/protocol_selftest.cpp" \
            -o protocol_selftest.exe
          ./protocol_selftest.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/windows" \
            "${{ github.workspace }}/tests/relay_timestamp_clock_test.cpp" \
            -o relay_timestamp_clock_test.exe
          ./relay_timestamp_clock_test.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/windows" \
            "${{ github.workspace }}/tests/relay_recovery_gate_test.cpp" \
            -o relay_recovery_gate_test.exe
          ./relay_recovery_gate_test.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/windows" \
            "${{ github.workspace }}/tests/hevc_access_unit_test.cpp" \
            -o hevc_access_unit_test.exe
          ./hevc_access_unit_test.exe
          g++ -std=c++20 -O2 \
            -I"${{ github.workspace }}/protocol" \
            "${{ github.workspace }}/windows/receiver.cpp" \
            "${{ github.workspace }}/windows/gpu_frame_publisher.cpp" \
            -o receiver.exe \
            $(pkg-config --libs libavcodec libavformat libavutil libswscale) \
            $(pkg-config --libs libusbmuxd-2.0) -liphlpapi -lws2_32 -ld3d11 -ldxgi -lmfplat -ladvapi32
          ls -lh receiver.exe
          mkdir -p windows-binaries
          cp receiver.exe windows-binaries/
          ldd receiver.exe | awk '/\/mingw64\/bin\// { print $3 }' | sort -u | xargs -r -I{} cp "{}" windows-binaries/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: windows-binaries/
